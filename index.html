<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elina Arbo</title>
<style>
  :root{
    --pink-top:#c81d78;
    --pink-mid:#e64fa0;
    --pink-bottom:#f9c3e3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
    user-select:none;
  }
  #desktop{
    position:relative;
    width:100%; height:100vh; height:100dvh;
    background:linear-gradient(180deg, var(--pink-top) 0%, var(--pink-mid) 45%, var(--pink-bottom) 100%);
    overflow:hidden;
  }

  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px;
    color:#fff;
    font-weight:700;
    font-size:clamp(14px, 2.2vw, 17px);
    letter-spacing:0.2px;
    pointer-events:none;
    z-index:5;
  }
  #topbar a{ pointer-events:auto; color:#fff; }
  #topbar .right{ display:flex; align-items:center; gap:14px; font-variant-numeric:tabular-nums; font-weight:600; }
  #topbar .right a{ display:flex; }

  .icon{
    position:absolute;
    display:flex; flex-direction:column; align-items:center;
    cursor:grab;
    touch-action:none;
    z-index:2;
    transition:width 0.25s ease, left 0.25s ease, top 0.25s ease;
  }
  .icon:active{ cursor:grabbing; }
  .icon.expanded{ cursor:pointer; }
  .icon .thumb{
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.28));
  }
  .icon.expanded .thumb{
    filter:drop-shadow(0 20px 45px rgba(0,0,0,0.45));
  }
  .icon .thumb img{
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;
    pointer-events:none;
  }
  .icon .label{
    margin-top:8px;
    color:#fff;
    font-size:13px;
    font-weight:700;
    text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,0.25);
    line-height:1.25;
    max-width:130px;
  }
  .icon.dragging{ z-index:50; }

  .win{
    position:absolute;
    min-width:260px;
    width:min(480px, 88vw);
    background:#f4f4f4;
    border-radius:9px;
    box-shadow:0 25px 60px rgba(0,0,0,0.45);
    overflow:hidden;
    z-index:100;
    display:none;
  }
  .win.open{ display:block; }
  .win .titlebar{
    height:34px;
    background:linear-gradient(180deg,#ececec,#dcdcdc);
    border-bottom:1px solid #c8c8c8;
    display:flex; align-items:center;
    padding:0 12px;
    gap:8px;
    cursor:grab;
    touch-action:none;
  }
  .win .titlebar:active{ cursor:grabbing; }
  .win .tl-dot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .win .tl-dot.close-btn{ cursor:pointer; }
  .win .wtitle{
    flex:1; text-align:center; font-size:12.5px; font-weight:700; color:#444;
    margin-right:44px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .win .content{
    padding:20px 22px 22px;

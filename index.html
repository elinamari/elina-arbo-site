<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elina Arbo</title>
<style>
  :root{
    --pink-top:#c81d78;
    --pink-mid:#e64fa0;
    --pink-bottom:#f9c3e3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    overflow:hidden;
    user-select:none;
  }
  #desktop{
    position:relative;
    width:100%; height:100vh; height:100dvh;
    background:linear-gradient(180deg, var(--pink-top) 0%, var(--pink-mid) 45%, var(--pink-bottom) 100%);
    overflow:hidden;
  }

  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px;
    color:#fff;
    font-weight:700;
    font-size:clamp(14px, 2.2vw, 17px);
    letter-spacing:0.2px;
    pointer-events:none;
    z-index:5;
  }
  #topbar a{ pointer-events:auto; color:#fff; }
  #topbar .right{ display:flex; align-items:center; gap:14px; font-variant-numeric:tabular-nums; font-weight:600; }
  #topbar .right a{ display:flex; }

  .icon{
    position:absolute;
    display:flex; flex-direction:column; align-items:center;
    cursor:grab;
    touch-action:none;
    z-index:2;
  }
  .icon:active{ cursor:grabbing; }
  .icon .thumb{
    display:flex; align-items:center; justify-content:center;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,0.28));
  }
  .icon .thumb img{
    display:block;
    width:100%;
    height:auto;
    object-fit:contain;
    pointer-events:none;
  }
  .icon .label{
    margin-top:8px;
    color:#fff;
    font-size:13px;
    font-weight:700;
    text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,0.25);
    line-height:1.25;
    max-width:130px;
  }
  .icon.dragging{ z-index:50; }

  .win{
    position:absolute;
    min-width:260px;
    width:min(480px, 88vw);
    background:#f4f4f4;
    border-radius:9px;
    box-shadow:0 25px 60px rgba(0,0,0,0.45);
    overflow:hidden;
    z-index:100;
    display:none;
  }
  .win.open{ display:block; }
  .win .titlebar{
    height:34px;
    background:linear-gradient(180deg,#ececec,#dcdcdc);
    border-bottom:1px solid #c8c8c8;
    display:flex; align-items:center;
    padding:0 12px;
    gap:8px;
    cursor:grab;
    touch-action:none;
  }
  .win .titlebar:active{ cursor:grabbing; }
  .win .tl-dot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .win .tl-dot.close-btn{ cursor:pointer; }
  .win .wtitle{
    flex:1; text-align:center; font-size:12.5px; font-weight:700; color:#444;
    margin-right:44px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .win .content{
    padding:20px 22px 22px;
    max-height:min(70vh, 70dvh);
    overflow:auto;
    font-size:14.5px;
    color:#222;
    line-height:1.55;
  }
  .win .content h2{ margin:0 0 10px; font-size:19px; }
  .win .content p{ margin:0 0 12px; }
  .win .content img.preview{
    width:100%; border-radius:8px; display:block; margin-bottom:10px;
  }
  .win .content a.btn{
    display:inline-block;
    margin-top:6px;
    background:var(--pink-top);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    font-size:13px;
    padding:9px 16px;
    border-radius:20px;
  }
  .win .content ul{ padding-left:18px; margin:0 0 12px; }
  .win .content li{ margin-bottom:6px; }

  #win-image-viewer .content{ padding:0; }
  #win-image-viewer img{ width:100%; display:block; }

  #overlay{
    position:absolute; inset:0; background:rgba(0,0,0,0.15);
    display:none; z-index:90;
  }
  #overlay.show{ display:block; }

  @media (max-width:600px){
    .icon .label{ font-size:11.5px; max-width:100px; }
    #topbar{ padding:14px 16px; }
  }
</style>
</head>
<body>

<div id="desktop">
  <div id="overlay"></div>
  <div id="topbar">
    <div>Elina Arbo</div>
    <div class="right">
      <a href="#" id="ig-link" target="_blank" rel="noopener" title="Instagram">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1" fill="#fff" stroke="none"/>
        </svg>
      </a>
      <span id="clock">--:--:--</span>
    </div>
  </div>

  <!-- WINDOWS -->

  <div class="win" id="win-image-viewer">
    <div class="titlebar">
      <span class="tl-dot close-btn" style="background:#ff5f57"></span><span class="tl-dot" style="background:#febc2e"></span><span class="tl-dot" style="background:#28c840"></span>
      <div class="wtitle" id="image-viewer-title">Image</div>
    </div>
    <div class="content">
      <img id="image-viewer-img" src="" alt="">
    </div>
  </div>
</div>

<script>
  const ICONS = [
    {
      id: "about",
      label: "about.txt",
      image: "icons/about-icon.png",
      width: 96,
      x: 6, y: 16,
      action: { type: "window", target: "win-about" }
    },
    {
      id: "mixes",
      label: "Mixes.mp3",
      image: "icons/mp3-icon.png",
      width: 82,
      x: 75, y: 10,
      action: { type: "link", target: "https://soundcloud.com/elinaondeck" }
    },
    {
      id: "photo-booth",
      label: "me.jpeg",
      image: "icons/photo-booth.png",
      width: 100,
      x: 56, y: 38,
      action: { type: "image" }
    },
    {
      id: "moodring",
      label: "moodring.pdf",
      image: "icons/moodring.png",
      width: 100,
      x: 29, y: 57,
      action: { type: "image" }
    },
    {
      id: "email",
      label: "Email.me",
      image: "icons/email-icon.png",
      width: 78,
      x: 85, y: 66,
      action: { type: "link", target: "mailto:you@example.com" }
    }
  ];

  const INSTAGRAM_URL = "https://instagram.com/elinaarbo";

  const desktop = document.getElementById('desktop');
  const overlay = document.getElementById('overlay');
  document.getElementById('ig-link').href = INSTAGRAM_URL;

  function tick(){
    const d = new Date();
    const h = String(d.getHours()).padStart(2,'0');
    const m = String(d.getMinutes()).padStart(2,'0');
    const s = String(d.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = h+':'+m+':'+s;
  }
  tick(); setInterval(tick, 1000);

  function bringToFront(el){
    document.querySelectorAll('.win.open').forEach(w=>w.style.zIndex=100);
    el.style.zIndex = 200;
  }
  function openWindow(id){
    const w = document.getElementById(id);
    if(!w) return;
    document.querySelectorAll('.win.open').forEach(o=>o.classList.remove('open'));
    w.classList.add('open');
    overlay.classList.add('show');
    bringToFront(w);
  }
  function openImageViewer(cfg){
    document.getElementById('image-viewer-img').src = cfg.expandImage || cfg.image;
    document.getElementById('image-viewer-title').textContent = cfg.label;
    openWindow('win-image-viewer');
  }
  function closeAllWindows(){
    document.querySelectorAll('.win.open').forEach(o=>o.classList.remove('open'));
    overlay.classList.remove('show');
  }
  overlay.addEventListener('click', closeAllWindows);
  document.querySelectorAll('.win .close-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); closeAllWindows(); });
  });

  function makeDraggable(handle, moveTarget, opts){
    opts = opts || {};
    let startX, startY, startLeft, startTop, dragging=false, moved=false;

    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      const rect = moveTarget.getBoundingClientRect();
      const parentRect = desktop.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      startLeft = rect.left - parentRect.left;
      startTop = rect.top - parentRect.top;
      dragging = true; moved = false;
      handle.setPointerCapture(e.pointerId);
      if(opts.onStart) opts.onStart();
    });
    handle.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      const parentRect = desktop.getBoundingClientRect();
      let newLeft = startLeft + dx, newTop = startTop + dy;
      newLeft = Math.max(4, Math.min(newLeft, parentRect.width - moveTarget.offsetWidth - 4));
      newTop = Math.max(4, Math.min(newTop, parentRect.height - moveTarget.offsetHeight - 4));
      moveTarget.style.left = newLeft + 'px';
      moveTarget.style.top = newTop + 'px';
      moveTarget.style.right = 'auto';
    });
    handle.addEventListener('pointerup', ()=>{
      dragging = false;
      if(opts.onEnd) opts.onEnd(moved);
    });
  }

  ICONS.forEach(cfg=>{
    const el = document.createElement('div');
    el.className = 'icon';
    el.style.left = cfg.x + '%';
    el.style.top = cfg.y + '%';
    el.style.width = 'min(' + cfg.width + 'px, ' + (cfg.width/1100*100).toFixed(1) + 'vw + 40px)';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.width = '100%';

    const img = document.createElement('img');
    img.src = cfg.image;
    img.alt = cfg.label;
    img.onerror = function(){
      thumb.innerHTML = '';
      thumb.style.background = 'rgba(255,255,255,0.85)';
      thumb.style.borderRadius = '10px';
      thumb.style.aspectRatio = '1/1';
      thumb.style.display = 'flex';
      thumb.style.alignItems = 'center';
      thumb.style.justifyContent = 'center';
      thumb.style.fontSize = '11px';
      thumb.style.color = '#888';
      thumb.style.textAlign = 'center';
      thumb.style.padding = '6px';
      thumb.textContent = 'missing image: ' + cfg.image;
    };
    thumb.appendChild(img);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = cfg.label;

    el.appendChild(thumb);
    el.appendChild(label);
    desktop.appendChild(el);

    makeDraggable(el, el, {
      onStart: ()=> el.classList.add('dragging'),
      onEnd: (moved)=>{
        el.classList.remove('dragging');
        if(!moved){
          if(cfg.action.type === 'window') openWindow(cfg.action.target);
          if(cfg.action.type === 'link') window.open(cfg.action.target, '_blank');
          if(cfg.action.type === 'image') openImageViewer(cfg);
        }
      }
    });
  });

  document.querySelectorAll('.win').forEach(win=>{
    const bar = win.querySelector('.titlebar');
    makeDraggable(bar, win, { onStart: ()=> bringToFront(win) });
    win.style.left = '20%';
    win.style.top = '18%';
  });
</script>

</body>
</html>
